# Build / vet / test the Go module on every PR and on pushes to main.
# All real work lives in `make ci`; this file is just glue, so
# reproducing CI locally is one command.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR or branch when a new commit
# lands. Keeps queue depth bounded without losing main-branch history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: make ci
        run: make ci
