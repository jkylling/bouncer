# GitHub auto-generates release notes from merged PRs since the
# previous tag whenever `generate_release_notes: true` is set on a
# release (see .github/workflows/release.yml). This file controls how
# those PRs get bucketed into sections.
#
# Quality of the resulting notes depends on:
#   - PR titles being readable on their own (squash-merge with the PR
#     title as the commit message — GitHub's default).
#   - PRs carrying the right labels.
# A PR labelled `skip-changelog` is omitted entirely.
changelog:
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - docs
    - title: Dependencies
      labels:
        - dependencies
    - title: Other
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
