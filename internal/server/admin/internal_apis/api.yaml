---
# bouncer-internal: control-plane / admin endpoints exposed by bouncer
# itself. Routed by a separate runtime so the user-facing /_api/apis
# listing isn't polluted with internal routes.
#
# One action per logical route. Path templates are used where chi's
# router has a single-method, fixed-shape mapping; `filter:` covers
# trailing-slash UI variants and Google-style `:verb` sub-resources.
#
# Policies in policies/{demo,simple,production}.yaml gate these
# actions by principal scope.

name: bouncer-internal
base_url: ""
path_prefixes:
- /_admin
- /_api
- /install

actions:
# --- Admin UI shells -------------------------------------------------
# Each `ui_*` action covers both `/_admin/...` and `/_admin/.../`.
# An anonymous denial on a UI shell is rendered as a 303 redirect to
# the login page; an authenticated denial returns 403 like any other
# route.
- name: ui_tokens
  filter: |
    request.method == "GET" &&
    (request.path == "/_admin" || request.path == "/_admin/" ||
     request.path.startsWith("/_admin/agents"))

- name: ui_login
  filter: |
    request.method == "GET" &&
    (request.path == "/_admin/login" || request.path == "/_admin/login/")

- name: ui_policies
  filter: |
    request.method == "GET" &&
    (request.path == "/_admin/policies" || request.path == "/_admin/policies/")

- name: ui_proposals
  filter: |
    request.method == "GET" &&
    (request.path == "/_admin/proposals" || request.path == "/_admin/proposals/")

- name: ui_traffic
  filter: |
    request.method == "GET" &&
    (request.path == "/_admin/traffic" || request.path == "/_admin/traffic/")

- name: ui_settings
  filter: |
    request.method == "GET" &&
    (request.path == "/_admin/settings" || request.path == "/_admin/settings/")

- name: ui_services
  filter: |
    request.method == "GET" && request.path.startsWith("/_admin/services")

- name: ui_onboarding
  filter: |
    request.method == "GET" &&
    request.path.startsWith("/_admin/onboarding")

- name: ui_traffic_propose
  method: GET
  path: /_admin/traffic/{id}/propose

# --- Auth + identity -------------------------------------------------
- name: login
  method: POST
  path: /_api/admin/login

- name: logout
  method: POST
  path: /_api/admin/logout

- name: whoami
  method: GET
  path: /_api/whoami

- name: tokens_issue
  method: POST
  path: /_api/issue/tokens

- name: tokens_issue_refresh
  method: POST
  path: /_api/issue/refresh

# --- Discovery / docs ------------------------------------------------
- name: ca_download
  method: GET
  path: /_api/ca.crt

- name: install_wrapper
  method: GET
  path: /install/bouncer-wrap

- name: install_ca_pem
  method: GET
  path: /install/ca.pem

- name: docs_agent
  method: GET
  path: /_api/docs

- name: docs_policies
  method: GET
  path: /_api/docs/policies

- name: docs_apis
  method: GET
  path: /_api/docs/apis

- name: apis_list
  method: GET
  path: /_api/apis

- name: apis_readme
  method: GET
  path: /_api/apis/{bundle}/readme

# --- Policies CRUD ---------------------------------------------------
- name: policies_capabilities
  filter: |
    request.method == "GET" &&
    request.path == "/_api/policies:capabilities"

- name: policies_dryrun
  filter: |
    request.method == "POST" &&
    request.path == "/_api/policies:dryRun"

- name: policies_list
  method: GET
  path: /_api/policies

- name: policies_get
  method: GET
  path: /_api/policies/{api}/{name}

- name: policies_create
  method: POST
  path: /_api/policies

- name: policies_replace
  method: PUT
  path: /_api/policies/{api}/{name}

- name: policies_delete
  method: DELETE
  path: /_api/policies/{api}/{name}

# --- Proposals -------------------------------------------------------
- name: proposals_list
  method: GET
  path: /_api/proposals

- name: proposals_create
  method: POST
  path: /_api/proposals

- name: proposals_get
  method: GET
  path: /_api/proposals/{id}

- name: proposals_update
  method: PATCH
  path: /_api/proposals/{id}

- name: proposals_delete
  method: DELETE
  path: /_api/proposals/{id}

- name: proposals_approve
  method: POST
  path: /_api/proposals/{id}/approve

- name: proposals_reject
  method: POST
  path: /_api/proposals/{id}/reject

- name: propose_policy
  method: POST
  path: /_api/traffic/{id}/propose-policy

# --- Traffic viewer --------------------------------------------------
- name: traffic_list
  method: GET
  path: /_api/traffic

- name: traffic_get
  method: GET
  path: /_api/traffic/{id}

- name: traffic_subjects
  method: GET
  path: /_api/traffic/subjects

# --- Connections (wizard) -------------------------------------------
- name: connections_providers
  method: GET
  path: /_api/connections/providers

- name: connections_list
  method: GET
  path: /_api/connections

- name: connections_put
  method: POST
  path: /_api/connections/{provider}

- name: connections_delete
  method: DELETE
  path: /_api/connections/{provider}

# --- Services (per-bundle UI surface) -------------------------------
- name: services_list
  method: GET
  path: /_api/services

- name: services_get
  method: GET
  path: /_api/services/{slug}

- name: services_connect
  method: POST
  path: /_api/services/{slug}/connect

- name: services_policies_list
  method: GET
  path: /_api/services/{slug}/policies

- name: services_policy_apply
  method: POST
  path: /_api/services/{slug}/policies/{id}/apply

- name: services_policies_apply_all
  method: POST
  path: /_api/services/{slug}/policies/apply

# --- Recipes (wizard) -----------------------------------------------
- name: recipes_list
  method: GET
  path: /_api/recipes

- name: recipes_preview
  method: POST
  path: /_api/recipes/{id}/preview

- name: recipes_apply
  method: POST
  path: /_api/recipes/{id}/apply

# --- Agents (registration + approval) -------------------------------
# Register is intentionally open: anonymous agents post here to ask
# for a slot, and the operator approves on the dashboard. Everything
# else (list / approve / reject) is admin-only.
- name: agents_register
  method: POST
  path: /_api/agents/register

- name: agents_list
  method: GET
  path: /_api/agents

# In-memory roll-up of Bearer-authenticated MCP callers. The
# dashboard "Connected agents" card reads this; the older
# /_api/traffic/subjects only surfaces subjects that made an
# upstream proxied call, so MCP-only agents never appeared.
# Literal path — must come before agents_get's {id} catch.
- name: agents_seen
  method: GET
  path: /_api/agents/seen

- name: agents_get
  method: GET
  path: /_api/agents/{id}

- name: agents_approve
  method: POST
  path: /_api/agents/{id}/approve

- name: agents_reject
  method: POST
  path: /_api/agents/{id}/reject

# --- MCP -------------------------------------------------------------
# /_api/mcp gates per-tool inside the JSON-RPC handler; the outer
# route only needs to be reachable for tools/list discovery.
- name: mcp
  method: POST
  path: /_api/mcp
