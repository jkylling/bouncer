# demo.yaml — open mode for live demos / workshops:
# JSON / MCP read endpoints are reachable without a JWT, but every
# dashboard page requires admin login. The half-open variant (UI
# shells anonymous, gated JSON behind admin) rendered pages that
# couldn't actually do anything; redirecting up front is less
# confusing.
#
# Use case: someone is screen-sharing the bouncer UI and wants
# zero-friction MCP / scripted access without juggling JWTs, while
# the dashboard itself is gated behind one admin login.
---
api: bouncer-internal
name: demo-open
description: Non-UI read endpoints and the login page are reachable without a JWT.
action: |
  action.name in [
    "ui_login",
    "login",
    "logout",
    "whoami",
    "ca_download",
    "docs_agent",
    "docs_policies",
    "docs_apis",
    "apis_list",
    "apis_readme",
    "policies_capabilities",
    "policies_list",
    "policies_get",
    "policies_dryrun",
    "policies_export",
    "proposals_list",
    "proposals_create",
    "proposals_get",
    "proposals_update",
    "proposals_delete",
    "mcp",
    "services_list",
    "services_get",
  ]
condition: "true"
result: permit
---
api: bouncer-internal
name: admin-only
description: Dashboard pages and dangerous primitives require admin.
principal: '"admin" in principal.scopes'
action: |
  action.name in [
    "ui_index",
    "ui_tokens",
    "ui_policies",
    "ui_proposals",
    "ui_traffic",
    "ui_settings",
    "ui_services",
    "tokens_issue",
    "tokens_issue_refresh",
    "policies_create",
    "policies_replace",
    "policies_delete",
    "policies_import",
    "proposals_approve",
    "proposals_reject",
    "traffic_list",
    "traffic_get",
  ]
condition: "true"
result: permit
