# demo.yaml — open mode for live demos / workshops:
# every endpoint is reachable without a JWT *except* admin endpoints
# (token issuance, policy CRUD writes, traffic viewer mutations).
#
# Use case: someone is screen-sharing the bouncer UI and wants
# zero-friction "click around" without juggling JWTs, but still
# wants the dangerous primitives gated.
---
api: bouncer-internal
name: demo-open
description: All non-admin internal endpoints are reachable without a JWT.
action: |
  action.name in [
    "ui_index",
    "ui_tokens",
    "ui_login",
    "ui_policies",
    "ui_traffic",
    "ui_settings",
    "ui_services",
    "login",
    "logout",
    "whoami",
    "ca_download",
    "docs_agent",
    "docs_policies",
    "docs_apis",
    "apis_list",
    "apis_readme",
    "policies_capabilities",
    "policies_list",
    "policies_get",
    "policies_dryrun",
    "traffic_subjects",
    "mcp",
    "services_list",
    "services_get",
  ]
condition: "true"
result: permit
---
api: bouncer-internal
name: admin-only
description: Even in demo mode, dangerous primitives still require admin.
principal: '"admin" in principal.scopes'
action: |
  action.name in [
    "tokens_issue",
    "tokens_issue_refresh",
    "tokens_page_issue",
    "tokens_page_issue_refresh",
    "policies_create",
    "policies_replace",
    "policies_delete",
    "traffic_list",
    "traffic_get",
  ]
condition: "true"
result: permit
