# simple.yaml — three-tier model:
#   - open: anyone (anonymous + authenticated + admin)
#   - authenticated: any verified JWT (user + admin)
#   - admin: only callers whose JWT carries `admin: true`
#
# The internal-policy middleware sets principal.scopes based on the
# verified Caller role:
#   anonymous -> []
#   user      -> ["user"]
#   admin     -> ["admin", "user"]   # admin implies user
#
# Tier checks live in `principal:` because they only read principal
# (no meta side calls), so they short-circuit before any per-action
# work. `condition:` stays "true" since there's nothing further to
# gate on.
---
api: bouncer-internal
name: open-discovery
description: Identity / discovery / docs / login UI are reachable without a JWT.
action: |
  action.name in [
    "ui_login",
    "login",
    "logout",
    "whoami",
    "ca_download",
    "docs_agent",
    "docs_policies",
    "docs_apis",
    "apis_list",
    "apis_readme",
    "policies_capabilities",
    "mcp",
  ]
condition: "true"
result: permit
---
api: bouncer-internal
name: authenticated-read
description: Authenticated callers may read the policy / traffic surface and the UI shells.
principal: '"user" in principal.scopes'
action: |
  action.name in [
    "ui_index",
    "ui_tokens",
    "ui_policies",
    "ui_proposals",
    "ui_traffic",
    "ui_settings",
    "ui_services",
    "policies_list",
    "policies_get",
    "policies_dryrun",
    "proposals_list",
    "proposals_create",
    "proposals_get",
    "proposals_update",
    "proposals_delete",
    "services_list",
    "services_get",
  ]
condition: "true"
result: permit
---
api: bouncer-internal
name: admin-only
description: Token issuance, policy CRUD writes, traffic, and proposal approve/reject are admin-only.
principal: '"admin" in principal.scopes'
action: |
  action.name in [
    "tokens_issue",
    "tokens_issue_refresh",
    "tokens_page_issue",
    "tokens_page_issue_refresh",
    "policies_create",
    "policies_replace",
    "policies_delete",
    "proposals_approve",
    "proposals_reject",
    "traffic_list",
    "traffic_get",
  ]
condition: "true"
result: permit
