# ---- drafts ------------------------------------------------------------
- name: list_drafts
  method: GET
  path: /gmail/v1/users/{user_id}/drafts

- name: get_draft
  method: GET
  path: /gmail/v1/users/{user_id}/drafts/{draft_id}
  binds:
    - |
      draft{ user_id: match.user_id, draft_id: match.draft_id }
    - |
      mailbox{ user_id: match.user_id }

- name: create_draft
  method: POST
  path: /gmail/v1/users/{user_id}/drafts
  bind: |
    mailbox{ user_id: match.user_id }

- name: update_draft
  method: PUT
  path: /gmail/v1/users/{user_id}/drafts/{draft_id}
  binds:
    - |
      draft{ user_id: match.user_id, draft_id: match.draft_id }
    - |
      mailbox{ user_id: match.user_id }

- name: send_draft
  # Gmail's drafts.send is `POST /drafts/send` with the draft id in the body
  # (`{"id": "...", "message": {...}}`), not in the URL — so the draft bind
  # reads `request.body.id`.
  method: POST
  path: /gmail/v1/users/{user_id}/drafts/send
  binds:
    - |
      draft{ user_id: match.user_id, draft_id: request.body.id }
    - |
      mailbox{ user_id: match.user_id }

- name: delete_draft
  method: DELETE
  path: /gmail/v1/users/{user_id}/drafts/{draft_id}
  binds:
    - |
      draft{ user_id: match.user_id, draft_id: match.draft_id }
    - |
      mailbox{ user_id: match.user_id }

