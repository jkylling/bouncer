- name: settings_get_cse_keypair
  method: GET
  path: /gmail/v1/users/{user_id}/settings/cse/keypairs/{keypair_id}
  binds:
    - |
      settings_cse_keypair{ user_id: match.user_id, keypair_id: match.keypair_id }
    - |
      mailbox{ user_id: match.user_id }

# `enable`, `disable` and `obliterate` use Google's `:method` suffix
# convention — the path segment looks like `{keyPairId}:enable`. The path
# template captures the whole segment; an extra filter narrows the verb
# and the bind splits on `:` to recover the bare keypair id.
- name: settings_enable_cse_keypair
  method: POST
  path: /gmail/v1/users/{user_id}/settings/cse/keypairs/{keypair_with_method}
  filter: match.keypair_with_method.endsWith(':enable')
  binds:
    - |
      settings_cse_keypair{ user_id: match.user_id, keypair_id: match.keypair_with_method.split(':')[0] }
    - |
      mailbox{ user_id: match.user_id }

- name: settings_disable_cse_keypair
  method: POST
  path: /gmail/v1/users/{user_id}/settings/cse/keypairs/{keypair_with_method}
  filter: match.keypair_with_method.endsWith(':disable')
  binds:
    - |
      settings_cse_keypair{ user_id: match.user_id, keypair_id: match.keypair_with_method.split(':')[0] }
    - |
      mailbox{ user_id: match.user_id }

- name: settings_obliterate_cse_keypair
  method: POST
  path: /gmail/v1/users/{user_id}/settings/cse/keypairs/{keypair_with_method}
  filter: match.keypair_with_method.endsWith(':obliterate')
  binds:
    - |
      settings_cse_keypair{ user_id: match.user_id, keypair_id: match.keypair_with_method.split(':')[0] }
    - |
      mailbox{ user_id: match.user_id }
